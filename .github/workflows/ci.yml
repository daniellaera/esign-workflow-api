name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff (lint)
        run: uv run ruff check --output-format=github .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy

  test:
    name: Tests with coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      # Docker is preinstalled on GitHub-hosted runners; testcontainers starts MongoDB.
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: esign-workflow-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
